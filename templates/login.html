{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · WorkPilot</title>
    <link rel="icon" type="image/png" href="{%static 'assets/icons/workpilot_favicon.svg'%}">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
            } catch (e) {}
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'csS/style.css' %}">
    <link rel="stylesheet" href="{% static 'csS/auth.css' %}">
</head>
<body>
    <div class="wp-auth-page">
        <header class="wp-auth-topbar">
            <a href="{% url 'frontend_login' %}" class="wp-brand-link">
                <span class="wp-brand-icon">W</span>
                <span>WorkPilot</span>
            </a>
            <button type="button" class="wp-theme-btn" data-theme-toggle aria-label="Toggle Light/Dark Mode">
                <span class="wp-theme-icon">☾</span>
                <span class="wp-theme-label">Dark Mode</span>
            </button>
        </header>

        <main class="wp-auth-container">
            <div class="wp-auth-card">
                <div class="wp-auth-header">
                    <h1 class="wp-auth-title">Welcome back</h1>
                    <p class="wp-auth-subtitle">Sign in with your WorkPilot username and password</p>
                </div>

                <div id="wpAuthNoticeContainer"></div>

                <form id="wpLoginForm" novalidate>
                    <div class="mb-3">
                        <label for="wpLoginUsername" class="form-label">Username</label>
                        <input
                            type="text"
                            id="wpLoginUsername"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="wpLoginPassword" class="form-label">Password</label>
                        <input
                            type="password"
                            id="wpLoginPassword"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" id="wpLoginSubmitBtn" class="btn btn-wp-accent w-100 py-2">
                        Sign In
                    </button>
                </form>

                <div class="wp-auth-footer">
                    Don't have an account yet?
                    <a href="{% url 'frontend_register' %}" class="fw-semibold">Create an account</a>
                </div>
                <div class="wp-auth-footer">
                    <a href="{% url 'email_input' %}" class="fw-semibold">Forgot password?</a>
                </div>
            </div>
        </main>

        <footer class="text-center py-3 small text-muted">
            WorkPilot Project &amp; Task Management
        </footer>
    </div>

    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>

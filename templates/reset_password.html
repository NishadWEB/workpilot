{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset · WorkPilot</title>
    <link rel="icon" type="image/png" href="{%static 'assets/icons/workpilot_favicon.svg'%}">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
            } catch (e) {}
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'csS/style.css' %}">
    <link rel="stylesheet" href="{% static 'csS/auth.css' %}">
</head>
<body>
    <div class="wp-auth-page">
        <header class="wp-auth-topbar">
            <a href="{% url 'frontend_login' %}" class="wp-brand-link">
                <span class="wp-brand-icon">W</span>
                <span>WorkPilot</span>
            </a>
            <button type="button" class="wp-theme-btn" data-theme-toggle aria-label="Toggle Light/Dark Mode">
                <span class="wp-theme-icon">☾</span>
                <span class="wp-theme-label">Dark Mode</span>
            </button>
        </header>

        <main class="wp-auth-container">
            <div class="wp-auth-card">
                <div class="wp-auth-header">
                    <h1 class="wp-auth-title">Password Reset</h1>
                    <p class="wp-auth-subtitle">Enter your new password</p>
                </div>

                <div id="wpAuthNoticeContainer"></div>

                <form id="wpResetPasswordForm" novalidate>
                    <div class="mb-3">
                        <label for="wpRegPassword" class="form-label">New Password</label>
                        <input
                            type="password"
                            id="wpRegPassword"
                            name="new_password"
                            class="form-control"
                            placeholder="Create a strong password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="wpRegConfirmPassword" class="form-label">Confirm Password</label>
                        <input
                            type="password"
                            id="wpRegConfirmPassword"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" id="wpResetPasswordSubmitBtn" class="btn btn-wp-accent w-100 py-2">
                        Submit
                    </button>
                </form>
            </div>
        </main>

        <footer class="text-center py-3 small text-muted">
            WorkPilot Project &amp; Task Management
        </footer>
    </div>

    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/reset_password.js' %}"></script>
</body>
</html>
